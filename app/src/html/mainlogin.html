<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Organ Donation System</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDy_7GuMOtMpeI1e5piI97zzo6RNNqSLNU",
      authDomain: "my-forgot-password.firebaseapp.com",
      projectId: "my-forgot-password",
      storageBucket: "my-forgot-password.appspot.com",
      messagingSenderId: "367097862323",
      appId: "1:367097862323:web:addeb8c4f9851eacbef8c6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.loginUser = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          msg.innerText = "✅ Login successful! Redirecting...";
          msg.style.color = "green";

          setTimeout(() => {
            window.location.href = "donar-recipient.html";
          }, 1000);
        })
        .catch((error) => {
          msg.innerText = "❌ " + error.message;
          msg.style.color = "red";
        });
    };
  </script>

  <style>
    body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #dfe9f3, #ffffff);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: #ffffff;
  border-radius: 15px;
  width: 360px;
  padding: 35px;
  box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.12);
  text-align: center;
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  margin-bottom: 20px;
  font-size: 26px;
  font-weight: 600;
  color: #1b365c; 
}

input {
  width: 92%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #b8c4d6;
  font-size: 15px;
  outline: none;
  background: #f7f9fc; 
  transition: 0.3s;
}

input:focus {
  border-color: #1b365c;
  background: #ffffff;
  box-shadow: 0 0 6px rgba(27, 54, 92, 0.3);
}

button {
  width: 96%;
  padding: 12px;
  margin-top: 15px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  cursor: pointer;

  background: #1b365c; 
  color: white;
  transition: 0.3s;
}

button:hover {
  background: #142844;
  transform: translateY(-2px);
}

#msg {
  margin-top: 15px;
  font-size: 14px;
  font-weight: 500;
  color: #1b365c;
}

.links {
  margin-top: 20px;
  font-size: 14px;
}

.links a {
  text-decoration: none;
  color: #1b365c;
  font-weight: 600;
}

.links a:hover {
  text-decoration: underline;
}

  </style>
</head>
<body>
  <div class="container">
    <h2>Organ Donation System - Login</h2>
    <input type="email" id="email" placeholder="Enter Email" required><br>
    <input type="password" id="password" placeholder="Enter Password" required><br>
    <button onclick="loginUser()">Login</button>
    <p id="msg"></p>
    <div class="links">
      <a href="mainregister.html">New user? Register</a> | 
      <a href="forgotpass.html">Forgot Password?</a>
    </div>
  </div>
</body>
</html>
